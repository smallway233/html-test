<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>备案回执编辑</title>
  <script src="/info/Content/qrcode/js/jquery-1.11.1.js"></script>
  <script src="/info/Content/qrcode/js/utf.js"></script>
  <script src="/info/Content/qrcode/js/jquery.qrcode.js"></script>
  <script src="/info/Content/qrcode/js/qrcode.js"></script>
  <script src="js/receipt.js"></script>
  <style>
    :root {
      --bg: #eef2f6;
      --panel: #ffffff;
      --line: #d5dde7;
      --text: #1f2a37;
      --muted: #667585;
      --accent: #1a5f9e;
      --accent-dark: #134a7a;
      --ok: #1f7a4d;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, #dce7f2 0%, var(--bg) 220px),
        var(--bg);
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px 20px 40px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
    }
    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 10px;
      box-shadow: 0 8px 24px rgba(20, 40, 70, .05);
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }
    textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(26, 95, 158, .2);
      border-color: var(--accent);
    }
    .sign-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .sign-item {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #f8fafc;
    }
    .sign-item .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sign-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .sign-head button {
      padding: 4px 10px;
      color: var(--danger);
      border-color: #f2c7c3;
      background: #fff5f4;
    }
    .status {
      margin-top: 8px;
      min-height: 22px;
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 10px 8px;
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #qrPreview {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid var(--line);
    }
    #qrPreview img, #qrPreview canvas { max-width: 100%; max-height: 100%; }
    .qr-url {
      width: 100%;
      word-break: break-all;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: -4px 0 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>备案回执编辑</h1>
      <p>修改右侧回执字段与二维码，保存到 <code>data/report.json</code></p>
    </div>
    <div class="actions">
      <a class="btn" href="page_source.html" target="_blank">打开展示页</a>
      <button type="button" id="btnReload">重新加载</button>
      <button type="button" class="primary" id="btnSave">保存</button>
    </div>
  </div>

  <div class="wrap">
    <section class="card">
      <h2>回执信息</h2>
      <div class="grid">
        <div class="field">
          <label>报告状态</label>
          <select id="ReportStatus">
            <option value="正常">正常</option>
            <option value="作废">作废</option>
          </select>
        </div>
        <div class="field">
          <label>是否涉密</label>
          <select id="IsSecurity">
            <option value="0">否</option>
            <option value="1">是</option>
          </select>
        </div>
        <div class="field">
          <label>报告编码</label>
          <input id="ReportCode" />
        </div>
        <div class="field">
          <label>合同编号</label>
          <input id="ContractCode" />
        </div>
        <div class="field">
          <label>报告类型</label>
          <input id="ReportType" />
        </div>
        <div class="field">
          <label>报告文号</label>
          <input id="ReportNumber" />
        </div>
        <div class="field full">
          <label>报告名称</label>
          <textarea id="ReportName"></textarea>
        </div>
        <div class="field">
          <label>评估结论</label>
          <input id="EvaluationConclusion" />
        </div>
        <div class="field">
          <label>评估报告日</label>
          <input id="ReportTime" placeholder="例如：2026年09月28日" />
        </div>
        <div class="field full">
          <label>评估机构名称</label>
          <input id="OrgName" />
        </div>
        <div class="field">
          <label>备案回执生成日期</label>
          <input id="ApplyTime" placeholder="例如：2026年09月28日" />
        </div>
      </div>

      <h2 style="margin-top: 8px;">签名人员</h2>
      <p class="hint">可增删多位签字人；展示页会按原站格式排版。</p>
      <div class="sign-list" id="signList"></div>
      <button type="button" id="btnAddSign">添加签名人员</button>
      <div class="status" id="saveStatus"></div>
    </section>

    <section class="card">
      <h2>二维码设置</h2>
      <div class="field">
        <label>内容来源</label>
        <select id="qrMode">
          <option value="current">当前展示页地址</option>
          <option value="custom">自定义链接</option>
        </select>
      </div>
      <div class="field" id="customUrlField">
        <label>自定义链接</label>
        <input id="qrCustomUrl" placeholder="https://..." />
      </div>
      <div class="field">
        <label>尺寸（像素）</label>
        <input id="qrSize" type="number" min="80" max="400" step="1" />
      </div>
      <div class="field">
        <label>中心 Logo 地址</label>
        <input id="qrLogo" />
      </div>
      <button type="button" id="btnPreviewQr" style="margin-bottom: 12px;">预览二维码</button>
      <div class="preview-box">
        <div id="qrPreview"></div>
        <div class="qr-url" id="qrUrlText"></div>
      </div>
    </section>
  </div>

  <script>
    var FIELDS = [
      "ReportStatus", "IsSecurity", "ReportCode", "ContractCode", "ReportType",
      "ReportNumber", "ReportName", "EvaluationConclusion", "ReportTime",
      "OrgName", "ApplyTime"
    ];

    function setStatus(msg, type) {
      var el = document.getElementById("saveStatus");
      el.textContent = msg || "";
      el.className = "status" + (type ? " " + type : "");
    }

    function signItemHtml(item, index) {
      item = item || {};
      return (
        '<div class="sign-item" data-index="' + index + '">' +
          '<div class="sign-head"><span>签名人员 #' + (index + 1) + '</span>' +
          '<button type="button" class="btn-remove">删除</button></div>' +
          '<div class="row">' +
            '<div class="field"><label>姓名</label><input class="s-name" value="' + esc(item.name) + '" /></div>' +
            '<div class="field"><label>类型</label><input class="s-type" value="' + esc(item.type || "资产评估师") + '" /></div>' +
            '<div class="field"><label>编号标签</label><input class="s-label" value="' + esc(item.numberLabel || "会员编号") + '" placeholder="正式会员编号 / 见习会员编号" /></div>' +
            '<div class="field"><label>编号</label><input class="s-number" value="' + esc(item.number) + '" /></div>' +
          "</div></div>"
      );
    }

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function renderSignList(list) {
      var box = document.getElementById("signList");
      box.innerHTML = (list || []).map(signItemHtml).join("");
      box.querySelectorAll(".btn-remove").forEach(function (btn) {
        btn.onclick = function () {
          var item = btn.closest(".sign-item");
          item.parentNode.removeChild(item);
          renumberSigns();
        };
      });
    }

    function renumberSigns() {
      document.querySelectorAll("#signList .sign-item").forEach(function (el, i) {
        el.setAttribute("data-index", i);
        el.querySelector(".sign-head span").textContent = "签名人员 #" + (i + 1);
      });
    }

    function collectSignatories() {
      var list = [];
      document.querySelectorAll("#signList .sign-item").forEach(function (el) {
        list.push({
          name: el.querySelector(".s-name").value.trim(),
          type: el.querySelector(".s-type").value.trim() || "资产评估师",
          numberLabel: el.querySelector(".s-label").value.trim() || "会员编号",
          number: el.querySelector(".s-number").value.trim()
        });
      });
      return list;
    }

    function fillForm(data) {
      FIELDS.forEach(function (k) {
        var el = document.getElementById(k);
        if (!el) return;
        el.value = data[k] == null ? "" : String(data[k]);
      });
      renderSignList(data.signatories || []);
      var qr = data.qr || {};
      document.getElementById("qrMode").value = qr.mode || "current";
      document.getElementById("qrCustomUrl").value = qr.customUrl || "";
      document.getElementById("qrSize").value = qr.size || 130;
      document.getElementById("qrLogo").value = qr.logo || "/info/Content/Img/logo.jpg";
      toggleCustomUrl();
      previewQr();
    }

    function collectForm() {
      var data = {};
      FIELDS.forEach(function (k) {
        data[k] = document.getElementById(k).value;
      });
      data.IsSecurity = Number(data.IsSecurity) || 0;
      data.signatories = collectSignatories();
      data.qr = {
        mode: document.getElementById("qrMode").value,
        customUrl: document.getElementById("qrCustomUrl").value.trim(),
        size: Number(document.getElementById("qrSize").value) || 130,
        logo: document.getElementById("qrLogo").value.trim()
      };
      return data;
    }

    function toggleCustomUrl() {
      var custom = document.getElementById("qrMode").value === "custom";
      document.getElementById("customUrlField").style.display = custom ? "flex" : "none";
    }

    function previewQr() {
      var data = collectForm();
      var qr = data.qr;
      var text = qr.mode === "custom" && qr.customUrl
        ? qr.customUrl
        : (location.origin + location.pathname.replace(/admin\.html$/, "page_source.html"));
      var size = Number(qr.size) || 130;
      document.getElementById("qrUrlText").textContent = text;
      ReceiptApp.paintQr($("#qrPreview"), text, size, qr.logo || "assets/images/logo.jpg");
    }

    // 兼容 /receipt/ 反代：接口走当前目录相对路径，而不是站点根 /api
    function appBase() {
      var path = location.pathname || "/";
      return path.replace(/[^/]*$/, "");
    }
    function apiUrl(name) {
      return appBase() + name.replace(/^\//, "");
    }

    async function loadData() {
      setStatus("加载中...");
      try {
        var data = await ReceiptApp.loadReport(apiUrl("api/report"));
        fillForm(data);
        setStatus("已加载备案数据", "ok");
      } catch (e) {
        setStatus(e.message || String(e), "err");
      }
    }

    async function saveData() {
      var data = collectForm();
      setStatus("保存中...");
      try {
        var res = await fetch(apiUrl("api/report"), {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(data)
        });
        var text = await res.text();
        var json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error("接口未返回 JSON（当前地址：" + apiUrl("api/report") + "）");
        }
        if (!res.ok || !json.ok) throw new Error((json && json.error) || "保存失败");
        setStatus("已保存到 data/report.json，展示页刷新即可生效", "ok");
        previewQr();
      } catch (e) {
        setStatus("保存失败：" + (e.message || e), "err");
      }
    }

    document.getElementById("qrMode").onchange = function () {
      toggleCustomUrl();
      previewQr();
    };
    document.getElementById("btnAddSign").onclick = function () {
      var list = collectSignatories();
      list.push({ name: "", type: "资产评估师", numberLabel: "会员编号", number: "" });
      renderSignList(list);
    };
    document.getElementById("btnPreviewQr").onclick = previewQr;
    document.getElementById("btnReload").onclick = loadData;
    document.getElementById("btnSave").onclick = saveData;
    ["qrCustomUrl", "qrSize", "qrLogo"].forEach(function (id) {
      document.getElementById(id).addEventListener("change", previewQr);
    });

    loadData();
  </script>
</body>
</html>
