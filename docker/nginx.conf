worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    server {
        listen 80 default_server;
        server_name _;

        location ^~ /info/ {
            proxy_pass https://uimp.cas.org.cn/info/;
            proxy_ssl_server_name on;
            proxy_ssl_name uimp.cas.org.cn;
            proxy_set_header Host uimp.cas.org.cn;
            proxy_set_header Referer https://uimp.cas.org.cn/info/;
            proxy_set_header Origin https://uimp.cas.org.cn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/css application/javascript;
            sub_filter 'https://uimp.cas.org.cn/info' '/info';
            sub_filter 'url(/images/cxcasorgcn/' 'url(/info/images/cxcasorgcn/';
            sub_filter_once off;
        }

        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
