# 备案回执：静态页走本地 python，官方 CSS/图片由本机反代，避免浏览器直连被 405
location /cas/ {
    alias /opt/cas-receipt/;
    index page_source.html;
    try_files $uri $uri/ =404;
}

location /cas/api/ {
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Content-Type $content_type;
    client_max_body_size 2m;
}

# 浏览器请求本域 /info/，Nginx 再回源 uimp.cas.org.cn
location ^~ /info/ {
    proxy_pass https://uimp.cas.org.cn/info/;
    proxy_ssl_server_name on;
    proxy_ssl_name uimp.cas.org.cn;
    proxy_set_header Host uimp.cas.org.cn;
    proxy_set_header Referer https://uimp.cas.org.cn/info/;
    proxy_set_header Origin https://uimp.cas.org.cn;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/css application/javascript;
    sub_filter 'https://uimp.cas.org.cn/info' '/info';
    sub_filter 'url(/images/cxcasorgcn/' 'url(/info/images/cxcasorgcn/';
    sub_filter_once off;
}
